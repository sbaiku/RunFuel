[project]
name = "runfuel"
version = "0.1.0"
description = "A personal running log with pace and calorie estimates."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2>=2.12",
    "ruff==0.16.6",
    "mypy==2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runfuel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
# docs/ holds the design spec and the implementation plan: historical records of
# what was decided and executed. Ruff formats Python blocks inside Markdown, so
# without this it rewrites those snippets and they stop matching what was built.
exclude = ["docs"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection *requires* these calls in argument defaults --
# it is the documented idiom, not an accident. Naming them here keeps B008
# active everywhere else rather than switching the rule off wholesale.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form"]
