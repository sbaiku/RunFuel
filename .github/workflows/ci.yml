name: CI

on:
  workflow_dispatch: 
  
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
    # This step checks out a copy of your repository.
      - name: Checkout repository
        uses: actions/checkout@v7

    # This step sets up Python 3.13 using the astral-sh/setup-uv action.
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0 
        with:
          python-version: "3.13"
          enable-cache: true
    # This step installs the dependencies defined in your pyproject.toml file.    
      - name: Install dependencies
        run: uv sync --locked --dev
        
      - name: Lint
        run: uv run ruff check . 

      - name: Type check
        run: uv run mypy src

      - name: Tests
        run: uv run pytest --maxfail=1 --disable-warnings -q
  

